name: aiignore
version: "0.2.0"
description: |
  Enforces .aiignore + .aiattributes — folder-local files that tell Hermes
  which paths it may not access (.aiignore, absolute block) and how access
  is modulated (.aiattributes — readonly, writeonly, noaccess, tool=name).
  Walks from each tool-call target path up to the filesystem root. .aiignore
  uses gitignore syntax. .aiattributes uses gitattributes suffix-style.
  Conforming implementation of the convention spec v0.2.
author: "Jochen Kulow"
license: "MIT"
homepage: "https://github.com/pyjoku/aiignore"
hooks:
  - pre_tool_call
